<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18BED5"/><stop offset="1" stop-color="#2782F8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B142A"/><stop offset="1" stop-color="#030A1A"/></linearGradient>
    <linearGradient id="metricBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172139"/><stop offset="1" stop-color="#0C1429"/></linearGradient>
    <linearGradient id="contextGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF1FF"/><stop offset="1" stop-color="#DCE9FA"/></linearGradient>
    <linearGradient id="coordFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303DA8"/><stop offset="1" stop-color="#142052"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif}.industry{font-size:42px;font-weight:780;fill:#fff;letter-spacing:-.6px}.section{font-size:24px;font-weight:760;fill:#fff}.client{font-size:35px;font-weight:760;fill:url(#accent);letter-spacing:-.4px}.lead{font-size:24px;font-weight:760;fill:#fff}.copy{font-size:18px;font-weight:430;fill:#C5CDEF}.panelTitle{font-size:26px;font-weight:760;fill:#fff}.body{font-size:16.5px;font-weight:430;fill:#C5CDEF}.metric{font-size:38px;font-weight:450;fill:#19BCE4}.metricLabel{font-size:15px;font-weight:520;fill:#C7CFEE}.note{font-size:10.5px;font-weight:500;fill:#7D879F}.brand{font-size:22px;font-weight:800;font-style:italic;fill:#fff;letter-spacing:-.6px}.vizTitle{font-size:14px;font-weight:800;letter-spacing:1.5px}.vizH{font-size:16px;font-weight:760}.vizMetric{font-size:22px;font-weight:780;fill:#17203A}.vizCap{font-size:11px;font-weight:800;letter-spacing:.8px}.vizSmall{font-size:12px;font-weight:520;fill:#68738D}.vizMicro{font-size:10px;font-weight:650;fill:#69748E}.dark{fill:#17203A}.light{fill:#ECF1FF}.cyan{fill:#1BC5E1}.blue{fill:#3A55C9}.green{fill:#17885B}.amber{fill:#A36B00}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#000"/>
  <text x="36" y="62" class="industry">Healthcare &amp; Life Sciences</text>
  <text x="1538" y="45" text-anchor="end" class="brand">HEXaware</text>
  <text x="36" y="111" class="section">Client</text>
  <text x="36" y="151" class="client" text-anchor="start"><tspan x="36" dy="0">A startup-like product environment building</tspan><tspan x="36" dy="40">a portfolio of digital portals</tspan></text>
  <g><rect x="36" y="220" width="740" height="342" rx="18" fill="#F7F9FC" stroke="#20BED6" stroke-width="1.5"/><text x="406" y="257" text-anchor="middle" class="vizTitle dark">AI ACROSS THE DELIVERY LIFECYCLE</text><circle cx="115" cy="340" r="43" fill="#E9EEFF" stroke="#5169D7" stroke-width="1.5"/><text x="115" y="338" text-anchor="middle" class="vizMicro dark">Requirements</text><text x="115" y="356" text-anchor="middle" class="vizMicro blue">AI supported</text><line x1="159" y1="340" x2="202" y2="340" stroke="#7F8DB8" stroke-width="2"/><circle cx="251" cy="340" r="43" fill="#E9EEFF" stroke="#5169D7" stroke-width="1.5"/><text x="251" y="338" text-anchor="middle" class="vizMicro dark">Experience design</text><text x="251" y="356" text-anchor="middle" class="vizMicro blue">AI supported</text><line x1="295" y1="340" x2="338" y2="340" stroke="#7F8DB8" stroke-width="2"/><circle cx="387" cy="340" r="43" fill="#E9EEFF" stroke="#5169D7" stroke-width="1.5"/><text x="387" y="338" text-anchor="middle" class="vizMicro dark">Build</text><text x="387" y="356" text-anchor="middle" class="vizMicro blue">AI supported</text><line x1="431" y1="340" x2="474" y2="340" stroke="#7F8DB8" stroke-width="2"/><circle cx="523" cy="340" r="43" fill="#E9EEFF" stroke="#5169D7" stroke-width="1.5"/><text x="523" y="338" text-anchor="middle" class="vizMicro dark">Test</text><text x="523" y="356" text-anchor="middle" class="vizMicro blue">AI supported</text><line x1="567" y1="340" x2="610" y2="340" stroke="#7F8DB8" stroke-width="2"/><circle cx="659" cy="340" r="43" fill="#E5F9F0" stroke="#21A96D" stroke-width="1.5"/><text x="659" y="338" text-anchor="middle" class="vizMicro dark">Release</text><text x="659" y="356" text-anchor="middle" class="vizMicro green">AI supported</text><rect x="67" y="424" width="650" height="90" rx="14" fill="#071127"/><text x="92" y="457" class="vizCap cyan">FIVE PORTALS REQUIRED*</text><rect x="92" y="473" width="95" height="25" rx="6" fill="#164C3A" stroke="#32C98A"/><text x="139.5" y="490" text-anchor="middle" class="vizMicro light">released?</text><rect x="211" y="473" width="95" height="25" rx="6" fill="#141F3D" stroke="#53658E"/><text x="258.5" y="490" text-anchor="middle" class="vizMicro light">portal 2</text><rect x="330" y="473" width="95" height="25" rx="6" fill="#141F3D" stroke="#53658E"/><text x="377.5" y="490" text-anchor="middle" class="vizMicro light">portal 3</text><rect x="449" y="473" width="95" height="25" rx="6" fill="#141F3D" stroke="#53658E"/><text x="496.5" y="490" text-anchor="middle" class="vizMicro light">portal 4</text><rect x="568" y="473" width="95" height="25" rx="6" fill="#141F3D" stroke="#53658E"/><text x="615.5" y="490" text-anchor="middle" class="vizMicro light">portal 5</text><text x="717" y="540" text-anchor="end" class="vizMicro">*portal names and release status require confirmation</text></g>
  <text x="36" y="610" class="lead" text-anchor="start"><tspan x="36" dy="0">End-to-end AI delivery with a lean team</tspan></text>
  <text x="36" y="654" class="copy" text-anchor="start"><tspan x="36" dy="0">The organization needs five portals and has limited external support. The delivery</tspan><tspan x="36" dy="27">model must carry each product from requirements through release without creating</tspan><tspan x="36" dy="27">disconnected handoffs.</tspan></text>
  <path d="M842 90H1460Q1515 90 1548 150L1575 197V852H842Q812 852 812 822V120Q812 90 842 90Z" fill="url(#panel)" stroke="#7E8BC6" stroke-width="1.5"/>
  <text x="858" y="157" class="panelTitle">Solution</text>
  <circle cx="858" cy="198" r="3" fill="#B8C2EA"/><text x="875" y="203" class="body" text-anchor="start"><tspan x="875" dy="0">Use AI to structure requirements and maintain traceability into</tspan><tspan x="875" dy="21">design and implementation.</tspan></text><circle cx="858" cy="247" r="3" fill="#B8C2EA"/><text x="875" y="252" class="body" text-anchor="start"><tspan x="875" dy="0">Apply AI during experience design, development, testing and</tspan><tspan x="875" dy="21">release preparation.</tspan></text><circle cx="858" cy="296" r="3" fill="#B8C2EA"/><text x="875" y="301" class="body" text-anchor="start"><tspan x="875" dy="0">Reuse patterns and evidence across the portal portfolio while</tspan><tspan x="875" dy="21">preserving product differences.</tspan></text><circle cx="858" cy="345" r="3" fill="#B8C2EA"/><text x="875" y="350" class="body" text-anchor="start"><tspan x="875" dy="0">Confirm the released portal, timing and remaining portal scope</tspan><tspan x="875" dy="21">before final publication.</tspan></text>
  <text x="858" y="468" class="panelTitle">Benefits</text>
  <circle cx="858" cy="510" r="3" fill="#B8C2EA"/><text x="875" y="515" class="body" text-anchor="start"><tspan x="875" dy="0">One continuous delivery model across the full lifecycle.</tspan></text><circle cx="858" cy="538" r="3" fill="#B8C2EA"/><text x="875" y="543" class="body" text-anchor="start"><tspan x="875" dy="0">A lean team can reuse context and verification assets across</tspan><tspan x="875" dy="21">portals.</tspan></text><circle cx="858" cy="587" r="3" fill="#B8C2EA"/><text x="875" y="592" class="body" text-anchor="start"><tspan x="875" dy="0">Results and timing remain intentionally unstated until the full</tspan><tspan x="875" dy="21">case evidence is supplied.</tspan></text>
  <g><rect x="858" y="690" width="650" height="150" rx="18" fill="url(#metricBg)" stroke="#8794CE" stroke-width="1.5"/><text x="966.3333333333334" y="751" class="metric" text-anchor="middle">5*</text><text x="966.3333333333334" y="781" class="metricLabel" text-anchor="middle"><tspan x="966.3333333333334" dy="0">portals</tspan><tspan x="966.3333333333334" dy="20">required</tspan></text><line x1="1074.6666666666667" y1="710" x2="1074.6666666666667" y2="820" stroke="#263153"/><text x="1183" y="751" class="metric" text-anchor="middle">[NAME]</text><text x="1183" y="781" class="metricLabel" text-anchor="middle"><tspan x="1183" dy="0">portal released</tspan><tspan x="1183" dy="20">confirm</tspan></text><line x1="1291.3333333333333" y1="710" x2="1291.3333333333333" y2="820" stroke="#263153"/><text x="1399.6666666666665" y="751" class="metric" text-anchor="middle">[TBD]</text><text x="1399.6666666666665" y="781" class="metricLabel" text-anchor="middle"><tspan x="1399.6666666666665" dy="0">cycle time</tspan><tspan x="1399.6666666666665" dy="20">and team size</tspan></text></g>
  <text x="36" y="878" class="note">© Hexaware Technologies. Confidential briefing.</text>
  <text x="812" y="878" class="note">* Five-portal requirement supplied by the user. Release status, results and timing require confirmation.</text>
  <text x="1540" y="878" text-anchor="end" class="note">9</text>
</svg>