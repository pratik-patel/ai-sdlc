  <rect width="1600" height="900" fill="#000"/>
  <text x="36" y="62" class="industry">Legal Technology</text>
  <text x="1538" y="45" text-anchor="end" class="brand">HEXaware</text>
  <text x="36" y="111" class="section">Client</text>
  <text x="36" y="151" class="client" text-anchor="start"><tspan x="36" dy="0">A legal technology organization with</tspan><tspan x="36" dy="40">a distinct business and engineering need</tspan></text>
  <g><rect x="36" y="220" width="740" height="342" rx="18" fill="#F7F9FC" stroke="#20BED6" stroke-width="1.5"/><text x="406" y="257" text-anchor="middle" class="vizTitle dark">CASE EVIDENCE REQUIRED BEFORE PUBLICATION</text><rect x="66" y="279" width="680" height="39" rx="8" fill="#FFFFFF" stroke="#CFD7EA"/><text x="82" y="304" class="vizCap blue">STARTING CONDITION</text><text x="330" y="304" class="vizSmall">[content owner input]</text><rect x="66" y="329" width="680" height="39" rx="8" fill="#EEF2FA" stroke="#CFD7EA"/><text x="82" y="354" class="vizCap blue">AI APPROACH</text><text x="330" y="354" class="vizSmall">[content owner input]</text><rect x="66" y="379" width="680" height="39" rx="8" fill="#FFFFFF" stroke="#CFD7EA"/><text x="82" y="404" class="vizCap blue">DELIVERY MODEL</text><text x="330" y="404" class="vizSmall">[content owner input]</text><rect x="66" y="429" width="680" height="39" rx="8" fill="#EEF2FA" stroke="#CFD7EA"/><text x="82" y="454" class="vizCap blue">MEASURABLE OUTCOME</text><text x="330" y="454" class="vizSmall">[content owner input]</text><rect x="66" y="479" width="680" height="39" rx="8" fill="#FFFFFF" stroke="#CFD7EA"/><text x="82" y="504" class="vizCap blue">LESSON LEARNED</text><text x="330" y="504" class="vizSmall">[content owner input]</text><rect x="66" y="530" width="680" height="22" rx="6" fill="#FFF4D9"/><text x="406" y="546" text-anchor="middle" class="vizMicro amber">No differentiated claim has been inferred from the incomplete transcript.</text></g>
  <text x="36" y="610" class="lead" text-anchor="start"><tspan x="36" dy="0">Distinct AI use case pending case evidence</tspan></text>
  <text x="36" y="654" class="copy" text-anchor="start"><tspan x="36" dy="0">The available transcript does not establish the starting condition, delivery scope or</tspan><tspan x="36" dy="27">measurable result. A specific claim would be speculative until the content owner</tspan><tspan x="36" dy="27">supplies the facts.</tspan></text>
  <path d="M842 90H1460Q1515 90 1548 150L1575 197V852H842Q812 852 812 822V120Q812 90 842 90Z" fill="url(#panel)" stroke="#7E8BC6" stroke-width="1.5"/>
  <text x="858" y="157" class="panelTitle">Solution</text>
  <circle cx="858" cy="198" r="3" fill="#B8C2EA"/><text x="875" y="203" class="body" text-anchor="start"><tspan x="875" dy="0">Document the business problem and the engineering constraint in</tspan><tspan x="875" dy="21">concrete terms.</tspan></text><circle cx="858" cy="247" r="3" fill="#B8C2EA"/><text x="875" y="252" class="body" text-anchor="start"><tspan x="875" dy="0">Specify the AI approach, including where people review or</tspan><tspan x="875" dy="21">approve the work.</tspan></text><circle cx="858" cy="296" r="3" fill="#B8C2EA"/><text x="875" y="301" class="body" text-anchor="start"><tspan x="875" dy="0">Describe the delivery model, system boundaries and operating</tspan><tspan x="875" dy="21">controls.</tspan></text><circle cx="858" cy="345" r="3" fill="#B8C2EA"/><text x="875" y="350" class="body" text-anchor="start"><tspan x="875" dy="0">Add a measured outcome with baseline, comparison period and</tspan><tspan x="875" dy="21">evidence source.</tspan></text>
  <text x="858" y="468" class="panelTitle">Benefits</text>
  <circle cx="858" cy="510" r="3" fill="#B8C2EA"/><text x="875" y="515" class="body" text-anchor="start"><tspan x="875" dy="0">A dedicated example that does not duplicate another legal</tspan><tspan x="875" dy="21">technology story.</tspan></text><circle cx="858" cy="559" r="3" fill="#B8C2EA"/><text x="875" y="564" class="body" text-anchor="start"><tspan x="875" dy="0">A credible lesson grounded in the actual delivery model and</tspan><tspan x="875" dy="21">measured result.</tspan></text><circle cx="858" cy="608" r="3" fill="#B8C2EA"/><text x="875" y="613" class="body" text-anchor="start"><tspan x="875" dy="0">Publication remains blocked until the five required fact groups</tspan><tspan x="875" dy="21">are complete.</tspan></text>
  <g><rect x="858" y="690" width="650" height="150" rx="18" fill="url(#metricBg)" stroke="#8794CE" stroke-width="1.5"/><text x="966.3333333333334" y="751" class="metric" text-anchor="middle">[BASELINE]</text><text x="966.3333333333334" y="781" class="metricLabel" text-anchor="middle"><tspan x="966.3333333333334" dy="0">starting</tspan><tspan x="966.3333333333334" dy="20">condition</tspan></text><line x1="1074.6666666666667" y1="710" x2="1074.6666666666667" y2="820" stroke="#263153"/><text x="1183" y="751" class="metric" text-anchor="middle">[OUTCOME]</text><text x="1183" y="781" class="metricLabel" text-anchor="middle"><tspan x="1183" dy="0">measured</tspan><tspan x="1183" dy="20">result</tspan></text><line x1="1291.3333333333333" y1="710" x2="1291.3333333333333" y2="820" stroke="#263153"/><text x="1399.6666666666665" y="751" class="metric" text-anchor="middle">[LESSON]</text><text x="1399.6666666666665" y="781" class="metricLabel" text-anchor="middle"><tspan x="1399.6666666666665" dy="0">evidence-backed</tspan><tspan x="1399.6666666666665" dy="20">takeaway</tspan></text></g>
  <text x="36" y="878" class="note">© Hexaware Technologies. Confidential briefing.</text>
  <text x="812" y="878" class="note">Content-owner input required. No client, tool, outcome or productivity claim has been inferred.</text>
