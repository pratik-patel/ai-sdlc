<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18BED5"/><stop offset="1" stop-color="#2782F8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B142A"/><stop offset="1" stop-color="#030A1A"/></linearGradient>
    <linearGradient id="metricBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172139"/><stop offset="1" stop-color="#0C1429"/></linearGradient>
    <linearGradient id="contextGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF1FF"/><stop offset="1" stop-color="#DCE9FA"/></linearGradient>
    <linearGradient id="coordFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303DA8"/><stop offset="1" stop-color="#142052"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif}.industry{font-size:42px;font-weight:780;fill:#fff;letter-spacing:-.6px}.section{font-size:24px;font-weight:760;fill:#fff}.client{font-size:35px;font-weight:760;fill:url(#accent);letter-spacing:-.4px}.lead{font-size:24px;font-weight:760;fill:#fff}.copy{font-size:18px;font-weight:430;fill:#C5CDEF}.panelTitle{font-size:26px;font-weight:760;fill:#fff}.body{font-size:16.5px;font-weight:430;fill:#C5CDEF}.metric{font-size:38px;font-weight:450;fill:#19BCE4}.metricLabel{font-size:15px;font-weight:520;fill:#C7CFEE}.note{font-size:10.5px;font-weight:500;fill:#7D879F}.brand{font-size:22px;font-weight:800;font-style:italic;fill:#fff;letter-spacing:-.6px}.vizTitle{font-size:14px;font-weight:800;letter-spacing:1.5px}.vizH{font-size:16px;font-weight:760}.vizMetric{font-size:22px;font-weight:780;fill:#17203A}.vizCap{font-size:11px;font-weight:800;letter-spacing:.8px}.vizSmall{font-size:12px;font-weight:520;fill:#68738D}.vizMicro{font-size:10px;font-weight:650;fill:#69748E}.dark{fill:#17203A}.light{fill:#ECF1FF}.cyan{fill:#1BC5E1}.blue{fill:#3A55C9}.green{fill:#17885B}.amber{fill:#A36B00}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#000"/>
  <text x="36" y="62" class="industry">Transportation &amp; Logistics</text>
  <text x="1538" y="45" text-anchor="end" class="brand">HEXaware</text>
  <text x="36" y="111" class="section">Client</text>
  <text x="36" y="151" class="client" text-anchor="start"><tspan x="36" dy="0">A global enterprise operating a</tspan><tspan x="36" dy="40">large, modern engineering environment</tspan></text>
  <g><rect x="36" y="220" width="740" height="342" rx="18" fill="#F8F9FC" stroke="#20BED6" stroke-width="1.5"/><text x="406" y="257" text-anchor="middle" class="vizTitle dark">ENGINEERING CONTEXT LAYER</text><circle cx="405" cy="395" r="96" fill="url(#contextGlow)" stroke="#4B68D8" stroke-width="2"/><text x="405" y="386" text-anchor="middle" class="vizH dark">Unified context model</text><text x="405" y="411" text-anchor="middle" class="vizSmall">code + data + dependencies</text><line x1="405" y1="395" x2="140" y2="320" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="140" cy="320" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="140" y="324" text-anchor="middle" class="vizMicro">Flight ops</text><line x1="405" y1="395" x2="260" y2="274" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="260" cy="274" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="260" y="278" text-anchor="middle" class="vizMicro">Scheduling</text><line x1="405" y1="395" x2="405" y2="309" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="405" cy="309" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="405" y="313" text-anchor="middle" class="vizMicro">Training</text><line x1="405" y1="395" x2="510" y2="382" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="510" cy="382" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="510" y="386" text-anchor="middle" class="vizMicro">Payroll</text><line x1="405" y1="395" x2="440" y2="470" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="440" cy="470" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="440" y="474" text-anchor="middle" class="vizMicro">Accommodation</text><line x1="405" y1="395" x2="290" y2="504" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="290" cy="504" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="290" y="508" text-anchor="middle" class="vizMicro">Routing</text><line x1="405" y1="395" x2="145" y2="455" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="145" cy="455" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="145" y="459" text-anchor="middle" class="vizMicro">Profiles</text><line x1="405" y1="395" x2="95" y2="385" stroke="#A7B1CF" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="95" cy="385" r="28" fill="#FFFFFF" stroke="#7C89B8"/><text x="95" y="389" text-anchor="middle" class="vizMicro">Crew rules</text><g transform="translate(54,278)"><text class="vizMetric" x="0" y="0">6.2M*</text><text class="vizSmall" x="0" y="20">lines of code</text><text class="vizMetric" x="0" y="72">52,017*</text><text class="vizSmall" x="0" y="92">data interactions</text></g><g transform="translate(625,300)"><rect width="122" height="194" rx="14" fill="#071127" stroke="#2782F8"/><text x="61" y="31" text-anchor="middle" class="vizCap light">HARNESS</text><text x="61" y="66" text-anchor="middle" class="vizSmall light">understand</text><text x="61" y="98" text-anchor="middle" class="vizSmall light">generate</text><text x="61" y="130" text-anchor="middle" class="vizSmall light">verify</text><text x="61" y="168" text-anchor="middle" class="vizCap cyan">AT SCALE</text></g></g>
  <text x="36" y="610" class="lead" text-anchor="start"><tspan x="36" dy="0">Engineering harness for a complex environment</tspan></text>
  <text x="36" y="654" class="copy" text-anchor="start"><tspan x="36" dy="0">Forward engineering spans millions of lines of code and more than 50,000 data</tspan><tspan x="36" dy="27">interactions. Tightly coupled dependencies require reliable context before AI can</tspan><tspan x="36" dy="27">change the system.</tspan></text>
  <path d="M842 90H1460Q1515 90 1548 150L1575 197V852H842Q812 852 812 822V120Q812 90 842 90Z" fill="url(#panel)" stroke="#7E8BC6" stroke-width="1.5"/>
  <text x="858" y="157" class="panelTitle">Solution</text>
  <circle cx="858" cy="198" r="3" fill="#B8C2EA"/><text x="875" y="203" class="body" text-anchor="start"><tspan x="875" dy="0">Create a context layer that maps code, data flows, business</tspan><tspan x="875" dy="21">rules and dependencies.</tspan></text><circle cx="858" cy="247" r="3" fill="#B8C2EA"/><text x="875" y="252" class="body" text-anchor="start"><tspan x="875" dy="0">Use an engineering harness to give AI governed context before it</tspan><tspan x="875" dy="21">proposes a change.</tspan></text><circle cx="858" cy="296" r="3" fill="#B8C2EA"/><text x="875" y="301" class="body" text-anchor="start"><tspan x="875" dy="0">Generate changes through repeatable patterns and verify them</tspan><tspan x="875" dy="21">against system-level evidence.</tspan></text><circle cx="858" cy="345" r="3" fill="#B8C2EA"/><text x="875" y="350" class="body" text-anchor="start"><tspan x="875" dy="0">Use this case as the presenter handoff into the context and</tspan><tspan x="875" dy="21">harness story.</tspan></text>
  <text x="858" y="468" class="panelTitle">Benefits</text>
  <circle cx="858" cy="510" r="3" fill="#B8C2EA"/><text x="875" y="515" class="body" text-anchor="start"><tspan x="875" dy="0">More consistent changes across a large engineering estate.</tspan></text><circle cx="858" cy="538" r="3" fill="#B8C2EA"/><text x="875" y="543" class="body" text-anchor="start"><tspan x="875" dy="0">Faster impact analysis and less manual discovery.</tspan></text><circle cx="858" cy="566" r="3" fill="#B8C2EA"/><text x="875" y="571" class="body" text-anchor="start"><tspan x="875" dy="0">Verification evidence can scale with the volume of AI-generated</tspan><tspan x="875" dy="21">change.</tspan></text>
  <g><rect x="858" y="690" width="650" height="150" rx="18" fill="url(#metricBg)" stroke="#8794CE" stroke-width="1.5"/><text x="966.3333333333334" y="751" class="metric" text-anchor="middle">6.2M*</text><text x="966.3333333333334" y="781" class="metricLabel" text-anchor="middle"><tspan x="966.3333333333334" dy="0">lines of code</tspan><tspan x="966.3333333333334" dy="20">working figure</tspan></text><line x1="1074.6666666666667" y1="710" x2="1074.6666666666667" y2="820" stroke="#263153"/><text x="1183" y="751" class="metric" text-anchor="middle">52,017*</text><text x="1183" y="781" class="metricLabel" text-anchor="middle"><tspan x="1183" dy="0">data interactions</tspan><tspan x="1183" dy="20">working figure</tspan></text><line x1="1291.3333333333333" y1="710" x2="1291.3333333333333" y2="820" stroke="#263153"/><text x="1399.6666666666665" y="751" class="metric" text-anchor="middle">[TBD]</text><text x="1399.6666666666665" y="781" class="metricLabel" text-anchor="middle"><tspan x="1399.6666666666665" dy="0">dependencies</tspan><tspan x="1399.6666666666665" dy="20">to validate</tspan></text></g>
  <text x="36" y="878" class="note">© Hexaware Technologies. Confidential briefing.</text>
  <text x="812" y="878" class="note">* Working figures from supplied reference. Validate definitions and permission before publication.</text>
  <text x="1540" y="878" text-anchor="end" class="note">7</text>
</svg>