<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18BED5"/><stop offset="1" stop-color="#2782F8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B142A"/><stop offset="1" stop-color="#030A1A"/></linearGradient>
    <linearGradient id="metricBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172139"/><stop offset="1" stop-color="#0C1429"/></linearGradient>
    <linearGradient id="contextGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF1FF"/><stop offset="1" stop-color="#DCE9FA"/></linearGradient>
    <linearGradient id="coordFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303DA8"/><stop offset="1" stop-color="#142052"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif}.industry{font-size:42px;font-weight:780;fill:#fff;letter-spacing:-.6px}.section{font-size:24px;font-weight:760;fill:#fff}.client{font-size:35px;font-weight:760;fill:url(#accent);letter-spacing:-.4px}.lead{font-size:24px;font-weight:760;fill:#fff}.copy{font-size:18px;font-weight:430;fill:#C5CDEF}.panelTitle{font-size:26px;font-weight:760;fill:#fff}.body{font-size:16.5px;font-weight:430;fill:#C5CDEF}.metric{font-size:38px;font-weight:450;fill:#19BCE4}.metricLabel{font-size:15px;font-weight:520;fill:#C7CFEE}.note{font-size:10.5px;font-weight:500;fill:#7D879F}.brand{font-size:22px;font-weight:800;font-style:italic;fill:#fff;letter-spacing:-.6px}.vizTitle{font-size:14px;font-weight:800;letter-spacing:1.5px}.vizH{font-size:16px;font-weight:760}.vizMetric{font-size:22px;font-weight:780;fill:#17203A}.vizCap{font-size:11px;font-weight:800;letter-spacing:.8px}.vizSmall{font-size:12px;font-weight:520;fill:#68738D}.vizMicro{font-size:10px;font-weight:650;fill:#69748E}.dark{fill:#17203A}.light{fill:#ECF1FF}.cyan{fill:#1BC5E1}.blue{fill:#3A55C9}.green{fill:#17885B}.amber{fill:#A36B00}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#000"/>
  <text x="36" y="62" class="industry">Professional Services</text>
  <text x="36" y="111" class="section">Client</text>
  <text x="36" y="151" class="client" text-anchor="start"><tspan x="36" dy="0">A global enterprise scaling AI adoption</tspan><tspan x="36" dy="40">across teams, programs and functions</tspan></text>
  <g><rect x="36" y="220" width="740" height="342" rx="18" fill="#071127" stroke="#20BED6" stroke-width="1.5"/><text x="406" y="258" text-anchor="middle" class="vizTitle light">ENTERPRISE ADOPTION OPERATING MODEL</text><circle cx="405" cy="392" r="126" fill="none" stroke="#2639B8" stroke-width="22" opacity=".8"/><circle cx="405" cy="392" r="91" fill="none" stroke="#1D64C7" stroke-width="22" opacity=".8"/><circle cx="405" cy="392" r="56" fill="none" stroke="#1EA7CE" stroke-width="22" opacity=".8"/><circle cx="405" cy="392" r="37" fill="#0D1733" stroke="#43D0E1"/><text x="405" y="388" text-anchor="middle" class="vizCap light">~2,000</text><text x="405" y="407" text-anchor="middle" class="vizMicro light">participants</text><rect x="337" y="223" width="136" height="36" rx="18" fill="#111D3B" stroke="#5875D8"/><text x="405" y="245" text-anchor="middle" class="vizCap light">ENABLEMENT</text><rect x="552" y="309" width="136" height="36" rx="18" fill="#111D3B" stroke="#5875D8"/><text x="620" y="331" text-anchor="middle" class="vizCap light">GOVERNANCE</text><rect x="551" y="459" width="136" height="36" rx="18" fill="#111D3B" stroke="#5875D8"/><text x="619" y="481" text-anchor="middle" class="vizCap light">COST CONTROL</text><rect x="123" y="459" width="136" height="36" rx="18" fill="#111D3B" stroke="#5875D8"/><text x="191" y="481" text-anchor="middle" class="vizCap light">OPERATIONS</text><rect x="123" y="309" width="136" height="36" rx="18" fill="#111D3B" stroke="#5875D8"/><text x="191" y="331" text-anchor="middle" class="vizCap light">MEASUREMENT</text><text x="67" y="528" class="vizSmall light">Scale requires governed access, support capacity, outcome measurement and unit economics.</text><text x="717" y="548" text-anchor="end" class="vizMicro">Participant definition and reporting period require confirmation</text></g>
  <text x="36" y="610" class="lead" text-anchor="start"><tspan x="36" dy="0">Enterprise adoption at scale</tspan></text>
  <text x="36" y="654" class="copy" text-anchor="start"><tspan x="36" dy="0">Adoption at this scale creates an operating-system problem. Access, support and</tspan><tspan x="36" dy="27">governance must keep pace with enablement, measurement and cost control as many</tspan><tspan x="36" dy="27">teams use AI every day.</tspan></text>
  <path d="M842 90H1460Q1515 90 1548 150L1575 197V852H842Q812 852 812 822V120Q812 90 842 90Z" fill="url(#panel)" stroke="#7E8BC6" stroke-width="1.5"/>
  <text x="858" y="157" class="panelTitle">Solution</text>
  <circle cx="858" cy="198" r="3" fill="#B8C2EA"/><text x="875" y="203" class="body" text-anchor="start"><tspan x="875" dy="0">Establish a governed access model with clear ownership, approved</tspan><tspan x="875" dy="21">tools and support paths.</tspan></text><circle cx="858" cy="247" r="3" fill="#B8C2EA"/><text x="875" y="252" class="body" text-anchor="start"><tspan x="875" dy="0">Build enablement around real roles and workflows, then track</tspan><tspan x="875" dy="21">adoption and proficiency by cohort.</tspan></text><circle cx="858" cy="296" r="3" fill="#B8C2EA"/><text x="875" y="301" class="body" text-anchor="start"><tspan x="875" dy="0">Measure productivity and quality by program instead of relying</tspan><tspan x="875" dy="21">on raw activity metrics.</tspan></text><circle cx="858" cy="345" r="3" fill="#B8C2EA"/><text x="875" y="350" class="body" text-anchor="start"><tspan x="875" dy="0">Manage tokens and model usage through budgets, routing,</tspan><tspan x="875" dy="21">observability and unit-cost targets.</tspan></text>
  <text x="858" y="468" class="panelTitle">Benefits</text>
  <circle cx="858" cy="510" r="3" fill="#B8C2EA"/><text x="875" y="515" class="body" text-anchor="start"><tspan x="875" dy="0">Leaders can distinguish participation from sustained, productive</tspan><tspan x="875" dy="21">use.</tspan></text><circle cx="858" cy="559" r="3" fill="#B8C2EA"/><text x="875" y="564" class="body" text-anchor="start"><tspan x="875" dy="0">Governance and support scale with the number of teams and</tspan><tspan x="875" dy="21">programs.</tspan></text><circle cx="858" cy="608" r="3" fill="#B8C2EA"/><text x="875" y="613" class="body" text-anchor="start"><tspan x="875" dy="0">Cost management connects token consumption to verified delivery</tspan><tspan x="875" dy="21">outcomes.</tspan></text>
  <g><rect x="858" y="690" width="650" height="150" rx="18" fill="url(#metricBg)" stroke="#8794CE" stroke-width="1.5"/><text x="966.3333333333334" y="751" class="metric" text-anchor="middle">~2,000</text><text x="966.3333333333334" y="781" class="metricLabel" text-anchor="middle"><tspan x="966.3333333333334" dy="0">participants</tspan><tspan x="966.3333333333334" dy="20">definition TBD</tspan></text><line x1="1074.6666666666667" y1="710" x2="1074.6666666666667" y2="820" stroke="#263153"/><text x="1183" y="751" class="metric" text-anchor="middle">[TBD]</text><text x="1183" y="781" class="metricLabel" text-anchor="middle"><tspan x="1183" dy="0">programs / teams</tspan><tspan x="1183" dy="20">in scope</tspan></text><line x1="1291.3333333333333" y1="710" x2="1291.3333333333333" y2="820" stroke="#263153"/><text x="1399.6666666666665" y="751" class="metric" text-anchor="middle">[VALIDATE]</text><text x="1399.6666666666665" y="781" class="metricLabel" text-anchor="middle"><tspan x="1399.6666666666665" dy="0">tokens + cost</tspan><tspan x="1399.6666666666665" dy="20">do not publish yet</tspan></text></g>
  <text x="36" y="878" class="note">© Hexaware Technologies. Confidential briefing.</text>
  <text x="812" y="878" class="note">Validate participant count, reporting period, token volume, productivity method and disclosure permission.</text>
  <text x="1540" y="878" text-anchor="end" class="note">10</text>
</svg>
