  <rect width="1600" height="900" fill="#000"/>
  <text x="36" y="62" class="industry">Banking</text>
  <text x="1538" y="45" text-anchor="end" class="brand">HEXaware</text>
  <text x="36" y="111" class="section">Client</text>
  <text x="36" y="151" class="client" text-anchor="start"><tspan x="36" dy="0">A diversified financial institution with</tspan><tspan x="36" dy="40">multiple products and technology stacks</tspan></text>
  <g><rect x="36" y="220" width="740" height="342" rx="18" fill="#071127" stroke="#20BED6" stroke-width="1.5"/><text x="406" y="258" text-anchor="middle" class="vizTitle light">ONE TRANSFORMATION, MULTIPLE ENGINEERING SYSTEMS</text><rect x="67" y="285" width="224" height="42" rx="8" fill="#101B35" stroke="#2C8BFA"/><text x="84" y="303" class="vizCap cyan">CUSTOM SOFTWARE</text><text x="84" y="319" class="vizMicro light">product changes</text><line x1="292" y1="306" x2="392" y2="306" stroke="#3D77E5" stroke-width="2"/><rect x="67" y="343" width="224" height="42" rx="8" fill="#101B35" stroke="#2C8BFA"/><text x="84" y="361" class="vizCap cyan">PACKAGED APPS</text><text x="84" y="377" class="vizMicro light">configuration + integration</text><line x1="292" y1="364" x2="392" y2="364" stroke="#3D77E5" stroke-width="2"/><rect x="67" y="401" width="224" height="42" rx="8" fill="#101B35" stroke="#2C8BFA"/><text x="84" y="419" class="vizCap cyan">JAVA / PLATFORM</text><text x="84" y="435" class="vizMicro light">upgrade + compatibility</text><line x1="292" y1="422" x2="392" y2="422" stroke="#3D77E5" stroke-width="2"/><rect x="67" y="459" width="224" height="42" rx="8" fill="#101B35" stroke="#2C8BFA"/><text x="84" y="477" class="vizCap cyan">DATA + CLOUD</text><text x="84" y="493" class="vizMicro light">interfaces + operations</text><line x1="292" y1="480" x2="392" y2="480" stroke="#3D77E5" stroke-width="2"/><rect x="392" y="284" width="165" height="218" rx="20" fill="url(#coordFill)" stroke="#7E8FE8" stroke-width="1.5"/><text x="474" y="354" text-anchor="middle" class="vizCap light">AI DELIVERY</text><text x="474" y="378" text-anchor="middle" class="vizCap light">COORDINATION</text><text x="474" y="421" text-anchor="middle" class="vizSmall light">shared context</text><text x="474" y="445" text-anchor="middle" class="vizSmall light">sequenced change</text><text x="474" y="469" text-anchor="middle" class="vizSmall light">cross-stack proof</text><line x1="557" y1="326" x2="621" y2="326" stroke="#3D77E5" stroke-width="2"/><rect x="621" y="306" width="126" height="42" rx="8" fill="#101B35" stroke="#24BDD6"/><text x="684" y="332" text-anchor="middle" class="vizMicro light">release plan</text><line x1="557" y1="400" x2="621" y2="400" stroke="#3D77E5" stroke-width="2"/><rect x="621" y="380" width="126" height="42" rx="8" fill="#101B35" stroke="#24BDD6"/><text x="684" y="406" text-anchor="middle" class="vizMicro light">dependency map</text><line x1="557" y1="474" x2="621" y2="474" stroke="#3D77E5" stroke-width="2"/><rect x="621" y="454" width="126" height="42" rx="8" fill="#101B35" stroke="#24BDD6"/><text x="684" y="480" text-anchor="middle" class="vizMicro light">integrated evidence</text></g>
  <text x="36" y="610" class="lead" text-anchor="start"><tspan x="36" dy="0">Coordinated transformation across technologies</tspan></text>
  <text x="36" y="654" class="copy" text-anchor="start"><tspan x="36" dy="0">The program must move several forms of engineering work together. Custom software,</tspan><tspan x="36" dy="27">packaged applications and platform upgrades share dependencies, integration points</tspan><tspan x="36" dy="27">and release risk.</tspan></text>
  <path d="M842 90H1460Q1515 90 1548 150L1575 197V852H842Q812 852 812 822V120Q812 90 842 90Z" fill="url(#panel)" stroke="#7E8BC6" stroke-width="1.5"/>
  <text x="858" y="157" class="panelTitle">Solution</text>
  <circle cx="858" cy="198" r="3" fill="#B8C2EA"/><text x="875" y="203" class="body" text-anchor="start"><tspan x="875" dy="0">Plan the transformation as one portfolio rather than separate</tspan><tspan x="875" dy="21">codebase initiatives.</tspan></text><circle cx="858" cy="247" r="3" fill="#B8C2EA"/><text x="875" y="252" class="body" text-anchor="start"><tspan x="875" dy="0">Coordinate product changes, packaged application work, Java or</tspan><tspan x="875" dy="21">platform upgrades and integrations.</tspan></text><circle cx="858" cy="296" r="3" fill="#B8C2EA"/><text x="875" y="301" class="body" text-anchor="start"><tspan x="875" dy="0">Use shared context and cross-stack verification to expose</tspan><tspan x="875" dy="21">dependencies before release.</tspan></text><circle cx="858" cy="345" r="3" fill="#B8C2EA"/><text x="875" y="350" class="body" text-anchor="start"><tspan x="875" dy="0">Measure flow across teams and programs, including handoffs and</tspan><tspan x="875" dy="21">blocked work.</tspan></text>
  <text x="858" y="468" class="panelTitle">Benefits</text>
  <circle cx="858" cy="510" r="3" fill="#B8C2EA"/><text x="875" y="515" class="body" text-anchor="start"><tspan x="875" dy="0">A single delivery view across products and technology stacks.</tspan></text><circle cx="858" cy="538" r="3" fill="#B8C2EA"/><text x="875" y="543" class="body" text-anchor="start"><tspan x="875" dy="0">Earlier visibility into cross-team dependencies and release</tspan><tspan x="875" dy="21">conflicts.</tspan></text><circle cx="858" cy="587" r="3" fill="#B8C2EA"/><text x="875" y="592" class="body" text-anchor="start"><tspan x="875" dy="0">AI improves the whole program when coordination evidence guides</tspan><tspan x="875" dy="21">local engineering work.</tspan></text>
  <g><rect x="858" y="690" width="650" height="150" rx="18" fill="url(#metricBg)" stroke="#8794CE" stroke-width="1.5"/><text x="966.3333333333334" y="751" class="metric" text-anchor="middle">[TBD]</text><text x="966.3333333333334" y="781" class="metricLabel" text-anchor="middle"><tspan x="966.3333333333334" dy="0">programs</tspan><tspan x="966.3333333333334" dy="20">in scope</tspan></text><line x1="1074.6666666666667" y1="710" x2="1074.6666666666667" y2="820" stroke="#263153"/><text x="1183" y="751" class="metric" text-anchor="middle">[TBD]</text><text x="1183" y="781" class="metricLabel" text-anchor="middle"><tspan x="1183" dy="0">delivery teams</tspan><tspan x="1183" dy="20">coordinated</tspan></text><line x1="1291.3333333333333" y1="710" x2="1291.3333333333333" y2="820" stroke="#263153"/><text x="1399.6666666666665" y="751" class="metric" text-anchor="middle">[TBD]</text><text x="1399.6666666666665" y="781" class="metricLabel" text-anchor="middle"><tspan x="1399.6666666666665" dy="0">productivity</tspan><tspan x="1399.6666666666665" dy="20">change</tspan></text></g>
  <text x="36" y="878" class="note">© Hexaware Technologies. Confidential briefing.</text>
